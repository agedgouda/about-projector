title: 'Demo Page'
order: 2
fields:
  -
    handle: headline
    field:
      type: text
      display: Headline
      default: 'Page headline'
  -
    handle: subhead
    field:
      type: textarea
      display: Subhead
  -
    handle: demo_url
    field:
      type: text
      input_type: url
      display: 'Demo Link'
      instructions: 'Address of the demo page in the app. Leave blank to use https://projecthq.app/demo.'
  -
    handle: cta_text
    field:
      type: text
      display: 'CTA Text'
      instructions: 'Shown under the demo. Leave blank to hide.'
  -
    handle: cta_url
    field:
      type: text
      display: 'CTA Link'
      instructions: 'Leave blank to link to sign-up.'
  -
    handle: template
    field:
      type: hidden
      default: videos
  -
    handle: meta_description
    field:
      type: textarea
      display: 'Share Description'
      instructions: 'Shown under the title when this page is shared in email, Messages or social media. Leave blank to use the site default.'
      character_limit: 160
  -
    handle: seo_noindex
    field:
      type: toggle
      display: 'Hide from Search Engines'
      instructions: 'Adds a noindex tag and leaves this page out of the sitemap. Use for empty or private pages.'
      default: false
