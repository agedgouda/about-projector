title: Page
fields:
  -
    handle: sections
    field:
      type: replicator
      display: Sections
      sets:
        hero:
          display: Hero
          fields:
            -
              handle: headline
              field:
                type: text
                display: Headline
            -
              handle: subhead
              field:
                type: textarea
                display: Subhead
            -
              handle: cta_text
              field:
                type: text
                display: 'CTA Text'
            -
              handle: image
              field:
                type: assets
                display: Background Image
                container: assets
                max_files: 1
        features:
          display: Features
          fields:
            -
              handle: anchor
              field:
                type: hidden
                default: product
            -
              handle: items
              field:
                type: grid
                display: Items
                fields:
                  -
                    handle: title
                    field:
                      type: text
                      display: Title
                  -
                    handle: description
                    field:
                      type: textarea
                      display: Description
        how_it_works:
          display: 'How It Works'
          fields:
            -
              handle: steps
              field:
                type: grid
                display: Steps
                fields:
                  -
                    handle: title
                    field:
                      type: text
                      display: Title
                  -
                    handle: description
                    field:
                      type: textarea
                      display: Description
        demo:
          display: Demo
          fields:
            -
              handle: image
              field:
                type: assets
                display: Image
                container: assets
                max_files: 1
            -
              handle: description
              field:
                type: markdown
                display: Description
        testimonials:
          display: Testimonials
          fields:
            -
              handle: quotes
              field:
                type: grid
                display: Quotes
                fields:
                  -
                    handle: quote
                    field:
                      type: textarea
                      display: Quote
                  -
                    handle: author
                    field:
                      type: text
                      display: Author
        pricing:
          display: 'Simple Pricing'
          fields:
            -
              handle: plans
              field:
                type: grid
                display: Plans
                fields:
                  -
                    handle: name
                    field:
                      type: text
                      display: Plan Name
                  -
                    handle: price
                    field:
                      type: text
                      display: Price
                  -
                    handle: features
                    field:
                      type: grid
                      display: Features
                      fields:
                        -
                          handle: feature
                          field:
                            type: text
                            display: Feature
            -
              handle: cta_text
              field:
                type: text
                display: 'CTA Button Text'
            -
              handle: cta_url
              field:
                type: text
                display: 'CTA Button URL'
        final_cta:
          display: 'Final CTA'
          fields:
            -
              handle: headline
              field:
                type: text
                display: Headline
            -
              handle: description
              field:
                type: textarea
                display: Description
            -
              handle: cta_text
              field:
                type: text
                display: 'CTA Text'
            -
              handle: cta_url
              field:
                type: text
                display: 'CTA URL'
