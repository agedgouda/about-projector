<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title ?? "Projector" }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title ?? 'Projector' }}">
  <meta property="og:image" content="{{ config:app:url }}/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config:app:url }}/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  {{ vite src="resources/js/site.js|resources/css/site.css" }}
</head>

<body class="bg-white text-zinc-900 antialiased">

  <header class="bg-black">
    <nav class="px-6 h-20 flex items-center gap-8">
      <a href="/" class="flex items-center gap-3 shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-10 w-10 text-white">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
          </svg>
        <div class="flex flex-col leading-tight">
          <span class="text-base font-bold tracking-widest uppercase text-white">Projector</span>
          <span class="text-[10px] tracking-widest uppercase text-zinc-400">Every Project in Focus</span>
        </div>
      </a>
      <div class="ml-auto hidden md:flex items-center gap-8">
        {{ nav:main }}
          <a href="{{ url }}" class="text-xs font-semibold tracking-widest uppercase text-white hover:text-projector-primary-400 transition-colors">{{ title }}</a>
        {{ /nav:main }}
      </div>
      <div class="hidden md:flex items-center gap-4 shrink-0">
        <a href="https://projecthq.app/login" class="rounded border border-projector-primary-600 px-5 py-2 text-xs font-semibold tracking-widest uppercase text-white hover:bg-projector-primary-600 transition-colors">Login</a>
        <a href="https://projecthq.app/register" class="rounded border border-white bg-white px-5 py-2 text-xs font-semibold tracking-widest uppercase text-black hover:bg-black hover:text-white transition-colors">Get Started &rarr;</a>
      </div>
      <button id="mobile-menu-btn" class="md:hidden ml-auto text-white p-2" aria-label="Open menu">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </nav>
    <div id="mobile-menu" class="hidden md:hidden border-t border-zinc-800">
      <div class="px-6 py-4 flex flex-col gap-4">
        {{ nav:main }}
          <a href="{{ url }}" class="text-xs font-semibold tracking-widest uppercase text-white hover:text-projector-primary-400 transition-colors">{{ title }}</a>
        {{ /nav:main }}
        <div class="pt-2 flex flex-col gap-3">
          <a href="https://projecthq.app/login" class="rounded border border-projector-primary-600 px-5 py-2 text-xs font-semibold tracking-widest uppercase text-white text-center hover:bg-projector-primary-600 transition-colors">Login</a>
          <a href="https://projecthq.app/register" class="rounded border border-white bg-white px-5 py-2 text-xs font-semibold tracking-widest uppercase text-black text-center hover:bg-black hover:text-white transition-colors">Get Started &rarr;</a>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('mobile-menu-btn').addEventListener('click', function() {
        document.getElementById('mobile-menu').classList.toggle('hidden');
      });
    </script>
  </header>

  <main>
    {{ template_content }}
  </main>

  <footer class="bg-black">
    <div class="mx-auto max-w-6xl px-6 py-8 text-sm text-zinc-400">
      © {{ now format="Y" }} All rights reserved.
    </div>
  </footer>

</body>
</html>
