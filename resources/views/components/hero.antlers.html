<section class="bg-gradient-to-b from-projector-highlight-50 via-white to-white pt-24 px-6 text-center">
  <div class="mx-auto max-w-3xl">
    {{ if image }}
      <img src="{{ image:url }}" alt="" class="mx-auto mb-10 max-h-64 w-full object-cover rounded-2xl">
    {{ /if }}

    <h1 class="text-5xl font-bold tracking-tight text-zinc-900 mb-6">{{ headline }}</h1>
    {{ if subhead }}
      <p class="text-xl text-zinc-500 mb-10">{{ subhead }}</p>
    {{ /if }}
    {{ if cta_text }}
      <a href="https://projecthq.app/register" class="inline-block rounded-lg bg-projector-primary-600 px-8 py-3 text-base font-semibold text-white hover:bg-projector-primary-700 transition-colors">{{ cta_text }}</a>
    {{ /if }}
   </div>
   <span class="inline-flex pt-4 text-sm font-medium text-projector-primary-700"
    >AI-Powered Project Management</span>
</section>
