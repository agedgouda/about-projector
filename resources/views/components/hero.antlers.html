<section class="relative bg-cover bg-center min-h-[580px] flex items-center" style="background-image: url('{{ if image }}{{ image:url }}{{ else }}/assets/hero-bg.png{{ /if }}')">
<div class="relative z-10 mx-auto max-w-6xl px-6 py-24 text-center w-full">
    {{ if subhead }}
      <p class="text-5xl font-bold text-black mb-6 whitespace-nowrap">{{ subhead }}</p>
    {{ /if }}
    <h1 class="text-5xl font-bold tracking-tight text-black mb-6 uppercase">{{ headline }}</h1>
    {{ if cta_text }}
      <a href="https://projecthq.app/register" class="inline-block rounded-2xl bg-projector-primary-600 px-10 py-3 text-base font-semibold text-white hover:bg-black hover:text-white transition-colors">{{ cta_text }}</a>
    {{ /if }}
    <p class="mt-8 text-sm font-bold text-black tracking-wide">AI-Powered Project Management</p>
  </div>
</section>
