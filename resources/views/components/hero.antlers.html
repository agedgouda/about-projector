<section class="relative bg-cover bg-center min-h-[340px] md:min-h-[580px] flex items-center" style="background-image: url('{{ if image }}{{ image:url }}{{ else }}/assets/hero-bg.png{{ /if }}')">
  <div class="relative z-10 mx-auto max-w-6xl px-6 py-16 md:py-24 text-center w-full">
    <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-black mb-3 md:mb-4 uppercase">{{ headline }}</h1>
    {{ if subhead }}
      <p class="text-base md:text-lg font-semibold text-black mb-6 md:mb-12 uppercase tracking-wider">{{ subhead }}</p>
    {{ /if }}
    {{ if cta_text }}
      <a href="https://projecthq.app/register" class="inline-block rounded-2xl bg-projector-primary-600 px-8 md:px-10 py-3 text-base font-semibold text-white hover:bg-black hover:text-white transition-colors mt-8 md:mt-16">{{ cta_text }}</a>
    {{ /if }}
    <p class="mt-6 md:mt-8 text-sm font-bold text-black tracking-wide">AI-Powered Project Management</p>
  </div>
</section>
