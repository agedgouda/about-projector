<section class="pt-14 px-6 bg-white">
  <div class="mx-auto max-w-5xl">
    <h2 class="text-3xl font-bold text-zinc-900 text-center mb-12">What Our Users Say</h2>
    <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
      {{ quotes }}
        <figure class="rounded-2xl bg-zinc-50 p-8 ring-1 ring-zinc-200">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="h-8 w-8 text-projector-highlight-300 mb-4">
            <path d="M7.17 6.17A6.5 6.5 0 0 0 4 12v6h6v-6H6.5a4 4 0 0 1 2.5-3.7l-1.83-2.13Zm10 0A6.5 6.5 0 0 0 14 12v6h6v-6h-3.5a4 4 0 0 1 2.5-3.7L17.17 6.17Z" />
          </svg>
          <blockquote class="text-zinc-600 leading-relaxed mb-6">{{ quote }}</blockquote>
          <figcaption class="flex items-center gap-3">
            <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-projector-primary-100 text-projector-primary-700">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
            </span>
            <span class="text-sm font-semibold text-zinc-900">{{ author }}</span>
          </figcaption>
        </figure>
      {{ /quotes }}
    </div>
  </div>
</section>
