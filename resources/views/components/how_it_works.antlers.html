<section class="pt-14 px-6 bg-white">
  <div class="mx-auto max-w-3xl">
    <h2 class="text-3xl font-bold text-zinc-900 text-center mb-12">How It Works</h2>
    <ol class="space-y-10">
      {{ steps }}
        <li class="flex gap-6 items-start">
          <span class="relative flex-shrink-0 flex h-12 w-12 items-center justify-center rounded-xl bg-projector-primary-50 ring-1 ring-projector-primary-200 text-projector-primary-600">
            {{ if count == 1 }}
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
              </svg>
            {{ elseif count == 2 }}
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
              </svg>
            {{ else }}
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
            {{ /if }}
            <span class="absolute -top-2 -right-2 flex h-5 w-5 items-center justify-center rounded-full bg-projector-primary-600 text-[11px] font-bold text-white">{{ count }}</span>
          </span>
          <div>
            <h3 class="text-lg font-semibold text-zinc-900 mb-1">{{ title }}</h3>
            <p class="text-zinc-500 leading-relaxed">{{ description }}</p>
          </div>
        </li>
      {{ /steps }}
    </ol>
  </div>
</section>
