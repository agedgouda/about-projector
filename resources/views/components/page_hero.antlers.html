<section class="bg-projector-primary-600 px-6 pt-10.5 pb-8 md:pt-15.5 md:pb-10.5">
  <div class="mx-auto max-w-3xl text-center">
    <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-projector-highlight-200">{{ headline }}</h1>
    {{ if subhead }}
      <div class="mt-6 prose md:prose-lg prose-projector prose-p:leading-relaxed prose-p:text-white prose-li:text-white prose-strong:text-white prose-a:text-white prose-code:text-white prose-li:marker:text-white max-w-none text-white">{{ subhead }}</div>
    {{ /if }}
    {{ if cta_text }}
      <a href="{{ (cta_url ?? 'https://projecthq.app/register') | signup_ref('hero') }}" class="mt-10 inline-block rounded-2xl bg-projector-highlight-400 px-8 md:px-10 py-3 text-base font-semibold text-projector-highlight-950 hover:bg-projector-highlight-200 transition-colors">{{ cta_text }}</a>
    {{ /if }}
  </div>
  {{ if image || image_note }}
    <div class="mx-auto mt-12 md:mt-16 max-w-5xl">
      {{ if image }}
        <div class="flex justify-center">
          <div class="max-w-full overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-lg">
            <img src="{{ image:url }}" alt="{{ image:alt ?? '' }}" class="block max-w-full h-auto">
          </div>
        </div>
      {{ else }}
        {{ partial:image_placeholder }}
      {{ /if }}
    </div>
  {{ /if }}
</section>
