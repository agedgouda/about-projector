<section class="px-6 pt-16 pb-12 md:pt-24 md:pb-16">
  <div class="mx-auto max-w-3xl text-center">
    <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-projector-ink">{{ headline }}</h1>
    {{ if subhead }}
      <p class="mt-6 text-base md:text-lg leading-relaxed text-projector-graphite">{{ subhead }}</p>
    {{ /if }}
    {{ if cta_text }}
      <a href="{{ cta_url ?? 'https://projecthq.app/register' }}" class="mt-10 inline-block rounded-2xl bg-projector-primary-600 px-8 md:px-10 py-3 text-base font-semibold text-white hover:bg-black hover:text-white transition-colors">{{ cta_text }}</a>
    {{ /if }}
  </div>
  {{ if image || image_note }}
    <div class="mx-auto mt-12 md:mt-16 max-w-5xl">
      {{ if image }}
        <div class="overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-lg">
          <img src="{{ image:url }}" alt="{{ image:alt ?? '' }}" class="block w-full h-auto">
        </div>
      {{ else }}
        {{ partial:image_placeholder }}
      {{ /if }}
    </div>
  {{ /if }}
</section>
