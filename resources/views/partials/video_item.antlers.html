{{# One video with both views: the big player (main spot) and a card (below). site.js toggles them when swapping. #}}
<div data-video data-embed="{{ video_url ? (video_url | embed_url) : '' }}" data-file="{{ video_file:url }}" data-poster="{{ preview_image:url }}">
  <div data-video-stage class="relative aspect-video overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-zinc-200" {{ if !main }}hidden{{ /if }}>
    {{ if preview_image }}
      {{# Editor-supplied preview frame; the play button sits on top with just the icon. #}}
      <img src="{{ preview_image:url }}" alt="" class="absolute inset-0 h-full w-full object-cover">
      <button type="button" data-video-play class="group absolute inset-0 flex items-center justify-center bg-black/10 hover:bg-black/20 transition-colors">
        <span class="sr-only">Play {{ title }}</span>
        <span class="rounded-full bg-white/90 p-4 shadow-lg group-hover:bg-white transition-colors">
          <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-10 w-10 translate-x-0.5 text-projector-primary-600"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.1-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z" /></svg>
        </span>
      </button>
    {{ else }}
    <button type="button" data-video-play class="absolute inset-0 flex flex-col items-center justify-center gap-3 p-6 text-center hover:bg-projector-highlight-50 transition-colors">
      <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-14 w-14 text-projector-primary-600"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 0 1 0 .656l-5.603 3.113a.375.375 0 0 1-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112Z" /></svg>
      <span class="text-xl md:text-2xl font-semibold text-projector-ink">{{ title }}</span>
      {{ if caption }}<span class="text-sm text-projector-graphite">{{ caption }}</span>{{ /if }}
      {{ if !video_url && !video_file }}<span class="text-xs uppercase tracking-wide text-zinc-400">Video coming soon</span>{{ /if }}
    </button>
    {{ /if }}
    <div data-video-player class="absolute inset-0 bg-black" hidden></div>
  </div>
  <button type="button" data-video-thumb class="flex h-full w-full flex-col items-center justify-center gap-2 rounded-2xl bg-white p-6 text-center shadow-sm ring-1 ring-zinc-200 hover:ring-projector-primary-400 transition" {{ if main }}hidden{{ /if }}>
    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8 text-projector-primary-600"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 0 1 0 .656l-5.603 3.113a.375.375 0 0 1-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112Z" /></svg>
    <span class="text-lg font-semibold text-projector-ink">{{ title }}</span>
    {{ if caption }}<span class="text-sm text-projector-graphite">{{ caption }}</span>{{ /if }}
  </button>
</div>
